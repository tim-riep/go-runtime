<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Roles</title>
    <link rel="stylesheet" href="/trui/lib/trui.css" />
    <script type="importmap">
      {
        "imports": {
          "react": "/trui/lib/vendor/react.js",
          "react-dom": "/trui/lib/vendor/react-dom.js",
          "react-dom/client": "/trui/lib/vendor/react-dom-client.js",
          "react/jsx-runtime": "/trui/lib/vendor/react-jsx-runtime.js",
          "@tim-riep/trui": "/trui/lib/trui.js",
          "@tim-riep/trui/core": "/trui/lib/core.js",
          "@tim-riep/trui/icons": "/trui/lib/icons.js"
        }
      }
    </script>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      #root > .trui-root { min-height: 100%; background: var(--trui-color-background); }
      body { background: var(--trui-color-background, #fff); }
      .trfrontend-login { max-width: 24rem; margin: 2rem auto; padding: 0 1rem; display: grid; gap: 1rem; }
      .trfrontend-page { border: 0; width: 100%; height: 100%; min-height: 70vh; display: block; }
      .trfrontend-empty { padding: 1rem; }
      .trfrontend-list, .trfrontend-detail { display: grid; gap: 1rem; padding: 0 1rem 1rem; }
      .trfrontend-section { display: grid; gap: 0.5rem; }
      .trfrontend-filter-buttons { display: flex; gap: 0.5rem; align-items: end; }
      .trfrontend-value { display: block; min-height: 1.5em; }
      .trfrontend-authorizations { display: grid; gap: 0.75rem; border: 0; padding: 0; }
      .trfrontend-authorization { display: grid; gap: 0.5rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--trui-color-border, #ccc); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>The user interface of go-runtime needs JavaScript.</noscript>
    <script type="module" src="/trfrontend/roles.js"></script>
  </body>
</html>
