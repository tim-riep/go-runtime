# Releases the command rt for a tag v<version>: runs the Go tests, builds rt
# for Linux, macOS and Windows and attaches the archives with their checksums
# to the release. Tags of packages such as trfrontend-v<version> do not match.
name: rt release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Tests
        run: |
          go vet ./...
          go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          name="rt-$GITHUB_REF_NAME-$GOOS-$GOARCH"
          mkdir -p "dist/$name"
          ext=""
          if [ "$GOOS" = windows ]; then ext=".exe"; fi
          go build -trimpath -ldflags='-s -w' -o "dist/$name/rt$ext" ./cmd/rt
          cp LICENSE README.md "dist/$name/"
          cd dist
          if [ "$GOOS" = windows ]; then
            zip -r "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: rt-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: dist
        run: |
          sha256sum * > checksums.txt
          gh release create "$GITHUB_REF_NAME" * -R "$GITHUB_REPOSITORY" \
            --title "rt $GITHUB_REF_NAME" --generate-notes
