# Releases the package TRFRONTEND for a tag trfrontend-v<version>: checks
# that the tag matches the manifest, builds the user interface, runs the Go
# tests of the frontend and the tests in the browser against rt serve, and
# attaches TRFRONTEND-<version>.zip with the folder TRFRONTEND/ to the
# release, which rt install takes from there.
name: TRFRONTEND release

on:
  push:
    tags:
      - 'trfrontend-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TRUI_VERSION: 0.1.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/TRFRONTEND/web/package-lock.json

      - name: Check the version of the tag
        run: |
          version="${GITHUB_REF_NAME#trfrontend-v}"
          manifest=$(jq -r .version packages/TRFRONTEND/manifest.json)
          web=$(jq -r .version packages/TRFRONTEND/web/package.json)
          if [ "$version" != "$manifest" ] || [ "$version" != "$web" ]; then
            echo "tag $GITHUB_REF_NAME, manifest $manifest, web/package.json $web differ" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        working-directory: packages/TRFRONTEND/web
        run: |
          npm ci
          npm run check:headers
          npm run typecheck
          npm run build

      - name: Go tests of the frontend
        run: go test ./kernel -run Frontend

      - name: Tests in the browser
        working-directory: packages/TRFRONTEND/web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npx playwright install --with-deps chromium firefox webkit
          gh release download "v$TRUI_VERSION" -R tim-riep/trui -p "TRUI-$TRUI_VERSION.zip" -D "$RUNNER_TEMP"
          npm test
          TRUI_PACKAGE="$RUNNER_TEMP/TRUI-$TRUI_VERSION.zip" npm run test:e2e

      - name: Package
        working-directory: packages/TRFRONTEND/dist
        run: zip -r "$RUNNER_TEMP/TRFRONTEND-$VERSION.zip" TRFRONTEND

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/TRFRONTEND-$VERSION.zip" \
            --title "TRFRONTEND $VERSION" --notes "The package TRFRONTEND $VERSION for go-runtime."
